<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wi Padel Sherwood Pairs League</title>
<meta name="description" content="Fixtures, contacts, results and live standings for the Wi Padel Sherwood Pairs League. Play your nine matches in any order.">
<meta name="theme-color" content="#04061C">

<meta property="og:title" content="Wi Padel Sherwood Pairs League">
<meta property="og:description" content="Find your opponents, arrange your match, submit the score. Standings update instantly.">
<meta property="og:type" content="website">

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23000B7A'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%2378F700'/%3E%3C/svg%3E">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">

<link rel="stylesheet" href="assets/css/app.css?v=1">
</head>
<body>

<a class="skip" href="#main">Skip to content</a>

<div id="app">

  <header class="masthead">
    <div class="wrap masthead__inner">
      <div class="brand">
        <span class="brand__club">Wi&nbsp;Padel<br>Sherwood</span>
        <span class="brand__league">Pairs League</span>
      </div>
      <div class="masthead__meta" id="masthead-meta"></div>
    </div>
  </header>

  <nav class="nav" aria-label="Sections">
    <div class="wrap nav__inner" id="nav"></div>
  </nav>

  <main id="main" class="wrap" tabindex="-1">
    <div class="loader">
      <div class="loader__ball"></div>
      Loading the league&hellip;
    </div>
  </main>

  <footer class="foot wrap">
    <span id="foot-left">Wi Padel Sherwood Pairs League</span>
    <span id="foot-right"></span>
  </footer>

</div>

<!--
  No ?v= stamp on the module entry point, deliberately. A query string here only
  busts app.js; the browser resolves its imports (core.js, views.js, ...) without
  it, so a stamped entry beside unstamped imports could load new code against old
  modules. GitHub Pages serves assets with max-age=600, so every file refreshes
  within ten minutes of a deploy and the set stays consistent. app.css is stamped
  because it is a single file with no import graph.
-->
<script type="module" src="assets/js/app.js"></script>

<noscript>
  <div class="wrap" style="padding:30px 16px">
    <div class="notice notice--warn">
      <strong>JavaScript is switched off.</strong>
      This league tracker needs it to show fixtures and standings.
    </div>
  </div>
</noscript>

</body>
</html>
